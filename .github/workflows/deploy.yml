name: Deploy

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 21 * * *"
  # Manual runs redeploy main (for example after Deploy was paused) or, with `bootstrap`, push
  # the first image of a new project before Terraform creates the service. They never roll out a
  # rotated secret: Terraform pins each secret version in the service, and this workflow only
  # changes the image.
  workflow_dispatch:
    inputs:
      bootstrap:
        description: "The Cloud Run service does not exist yet: migrate with the newest POSTGRES_PASSWORD version"
        type: boolean
        default: false

# Serialize prod deploys but never cancel an in-flight one — overwriting an
# image mid-rollout produces unpredictable revisions. The group is per ref, so a
# manual run from another branch cannot replace a pending main deploy.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write   # Required for Workload Identity Federation
    env:
      PROJECT_ID: ${{ vars.GOOGLE_CLOUD_PROJECT }}
      REGION: ${{ vars.GOOGLE_CLOUD_REGION }}
      SERVICE: ${{ vars.GOOGLE_CLOUD_SERVICE_NAME }}
      REPO: ${{ vars.GOOGLE_CLOUD_ARTIFACT_REPO }}
      POSTGRES_HOSTNAME: ${{ vars.POSTGRES_HOSTNAME }}
      POSTGRES_USER: ${{ vars.POSTGRES_USER }}
      POSTGRES_DB: ${{ vars.POSTGRES_DB }}
      ATLAS_BASELINE_VERSION: ${{ vars.ATLAS_BASELINE_VERSION }}
    steps:
      # Workload Identity Federation trusts only this workflow on main; fail visibly
      # instead of reporting success for a manual run that deployed nothing.
      - name: Require main
        if: github.ref != 'refs/heads/main'
        run: |
          echo "::error::Deploy runs only from main, not ${GITHUB_REF}"
          exit 1

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - id: auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          project_id: ${{ env.PROJECT_ID }}
          workload_identity_provider: ${{ vars.GOOGLE_CLOUD_WIF_PROVIDER }}
          service_account: ${{ vars.GOOGLE_CLOUD_DEPLOYER_SA }}

      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1
        with:
          project_id: ${{ env.PROJECT_ID }}

      - name: Configure Docker auth for Artifact Registry
        run: gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --project="$PROJECT_ID" --quiet

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # No `context`: build from the Git context of this commit, so only committed files
      # reach the image and its cached layers, never files created during the job.
      # Scheduled runs skip the cache so the nightly rebuild picks up OS updates.
      - name: Build and push image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          push: true
          tags: ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPO }}/${{ env.SERVICE }}:${{ github.sha }}
          no-cache: ${{ github.event_name == 'schedule' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Install Atlas Community
        uses: ./.github/actions/install-atlas

      # Migrate with the POSTGRES_PASSWORD version the service pins, not `latest`: between adding
      # a version and Terraform pinning it, or after a pin is rolled back, `latest` is a password
      # the service does not use. Read the template, not the serving revision: the update below
      # creates its revision from the template. The deployer's Cloud Run role is bound on the
      # service itself, so a missing service returns PERMISSION_DENIED just like an existing one
      # it cannot read; only the operator can tell, so `latest` needs the `bootstrap` input.
      # Terraform pins version numbers only, so anything else (such as `latest`) is drift.
      - name: Resolve the POSTGRES_PASSWORD version the service pins
        id: postgres-password
        env:
          BOOTSTRAP: ${{ inputs.bootstrap }}
        run: |
          errors="$RUNNER_TEMP/describe-service.log"
          if service="$(gcloud run services describe "$SERVICE" --region="$REGION" --project="$PROJECT_ID" --format=json 2>"$errors")"; then
            reference="$(jq -c '[.spec.template.spec.containers[]? | select(.name == "app") | .env[]? | select(.name == "POSTGRES_PASSWORD") | .valueFrom.secretKeyRef]' <<<"$service")"
            version="$(jq -r 'if length == 1 and .[0].name == "POSTGRES_PASSWORD" then .[0].key // "" else "" end' <<<"$reference")"
            if ! [[ "$version" =~ ^[1-9][0-9]*$ ]]; then
              echo "::error::$SERVICE exists, but its app container does not read POSTGRES_PASSWORD from a version number of the POSTGRES_PASSWORD secret (found secretKeyRef: $reference)"
              exit 1
            fi
            if [ "$BOOTSTRAP" = true ]; then
              echo "::warning::$SERVICE exists, so the bootstrap input is ignored"
            fi
            echo "Migrating with POSTGRES_PASSWORD version $version, which $SERVICE pins."
          elif [ "$BOOTSTRAP" = true ] && grep -q -F \
            -e "Permission 'run.services.get' denied on resource 'namespaces/$PROJECT_ID/services/$SERVICE'" \
            -e "Cannot find service [$SERVICE]" "$errors"; then
            cat "$errors" >&2
            version=latest
            echo "bootstrap=true" >> "$GITHUB_OUTPUT"
            echo "::notice::Bootstrap run and $SERVICE cannot be found: migrating with the newest POSTGRES_PASSWORD version (latest) and skipping the image update"
          else
            cat "$errors" >&2
            echo "::error::Cannot read which POSTGRES_PASSWORD version $SERVICE pins. If the service does not exist yet, run this workflow with the bootstrap input."
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Apply database migrations
        env:
          POSTGRES_PASSWORD_VERSION: ${{ steps.postgres-password.outputs.version }}
        run: |
          for name in POSTGRES_HOSTNAME POSTGRES_USER POSTGRES_DB; do
            if [ -z "${!name}" ]; then
              echo "$name repository variable is required" >&2
              exit 1
            fi
          done

          POSTGRES_PASSWORD="$(gcloud secrets versions access "${POSTGRES_PASSWORD_VERSION:?}" --secret=POSTGRES_PASSWORD --project="$PROJECT_ID")"
          echo "::add-mask::$POSTGRES_PASSWORD"
          POSTGRES_USER_ENCODED="$(jq -rn --arg value "$POSTGRES_USER" '$value|@uri')"
          POSTGRES_PASSWORD_ENCODED="$(jq -rn --arg value "$POSTGRES_PASSWORD" '$value|@uri')"
          POSTGRES_DB_ENCODED="$(jq -rn --arg value "$POSTGRES_DB" '$value|@uri')"

          baseline_args=()
          if [ -n "$ATLAS_BASELINE_VERSION" ]; then
            baseline_args=(--baseline "$ATLAS_BASELINE_VERSION")
          fi

          atlas migrate apply \
            --env production \
            --var "database_url=postgres://${POSTGRES_USER_ENCODED}:${POSTGRES_PASSWORD_ENCODED}@${POSTGRES_HOSTNAME}:5432/${POSTGRES_DB_ENCODED}?sslmode=require&search_path=public" \
            "${baseline_args[@]}"

      # A bootstrap run stops after migrating: the service does not exist yet, and Terraform
      # creates it from this image.
      - name: Update Cloud Run service image
        if: steps.postgres-password.outputs.bootstrap != 'true'
        run: |
          gcloud run services update "$SERVICE" \
            --project="$PROJECT_ID" \
            --region="$REGION" \
            --container=app \
            --image="${REGION}-docker.pkg.dev/${PROJECT_ID}/${REPO}/${SERVICE}:${{ github.sha }}"
