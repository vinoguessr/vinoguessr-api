version: 2
updates:
  - package-ecosystem: "swift"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      # Validate the Buildx setup and image build actions together.
      docker-build:
        patterns:
          - "docker/setup-buildx-action"
          - "docker/build-push-action"
      # Validate Google Cloud authentication and SDK setup together.
      google-cloud:
        patterns:
          - "google-github-actions/*"
    cooldown:
      default-days: 7

  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7

  - package-ecosystem: "docker-compose"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
